name: Radar (buscar noticias)

on:
  # Schedule turned off 2026-11-05 at Hicham's request: Atlas Dépêche now
  # only imports Souss Actualités + RexFoot (src/instrumentation.ts). Still runnable
  # by hand from the Actions tab.
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run radar:once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
